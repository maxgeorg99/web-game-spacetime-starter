name: Build Tile Tower Defense Android

on:
  push:
    paths:
      - "projects/tile-tower-defense/**"
      - ".github/workflows/tile-tower-defense-android.yml"
  pull_request:
    paths:
      - "projects/tile-tower-defense/**"
      - ".github/workflows/tile-tower-defense-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tile-tower-defense-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: projects/tile-tower-defense
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - name: Build debug APK and unsigned release bundle
        run: bun run android:build
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tile-tower-defense-android-debug-${{ github.run_number }}
          path: projects/tile-tower-defense/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: tile-tower-defense-android-unsigned-${{ github.run_number }}
          path: projects/tile-tower-defense/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
