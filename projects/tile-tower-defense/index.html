<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#c6d3d6" />
    <title data-i18n="app.title">Tiled Tower Defense · Tile Tower Defense</title>
    <link rel="icon" href="%BASE_URL%art/keep.png" />
  </head>
  <body data-screen="menu">
    <main class="game-shell">
      <section
        id="session-menu"
        class="session-menu"
        aria-label="Multiplayer sessions"
        data-i18n-aria-label="a11y.sessions"
      >
        <div class="harbor-scenery" aria-hidden="true">
          <div class="harbor-sun"></div>
          <svg class="harbor-landscape" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
            <g fill="#94b9b8">
              <path d="m-120 390 300-140 280 140-280 130z" />
              <path d="m920 250 230-110 260 110-260 110z" />
            </g>
            <g fill="#749b98">
              <path d="m-120 390 300 130 280-130-90 170-190 50-180-70z" />
              <path d="m920 250 230 110 260-110-80 135-180 45-140-55z" />
            </g>
            <g fill="#dce7d8" opacity=".65">
              <path
                d="M70 218h80v-20h95v20h65v18H70zM945 470h90v-18h110v18h110v20H945zM520 130h60v-16h80v16h65v16H520z"
              />
            </g>
            <path d="m-130 710 400-160 360 145-355 185z" fill="#82936c" />
            <path d="m-130 710 405 170 355-185-100 205H0z" fill="#536e62" />
            <path d="m110 669 192-81 200 79-193 91z" fill="#c7b38a" />
            <path
              d="m142 675 169 65 157-72m-110-57 2 111m-79-108 1 112"
              fill="none"
              stroke="#ab956f"
              stroke-width="5"
            />
            <path d="M174 690v-74m258 73v-74" stroke="#59675a" stroke-width="12" />
            <path d="M174 630q130 60 258 0" fill="none" stroke="#e1cf9f" stroke-width="5" />
          </svg>
        </div>
        <div class="session-panel">
          <header class="harbor-heading">
            <h1>
              <img
                class="harbor-logo"
                src="%BASE_URL%art/branding/tiled-tower-defense-logo.png"
                alt="Tiled Tower Defense"
              />
            </h1>
            <img class="harbor-airship" src="%BASE_URL%art/factions/blue/airship.png" alt="" />
          </header>
          <div class="departure-layout">
            <aside class="captain-pass">
              <img class="pass-portrait" src="%BASE_URL%art/factions/blue/captain.png" alt="" />
              <div class="pass-details">
                <span class="pass-title" data-i18n="harbor.pass">Your boarding pass</span>
                <input
                  id="captain-name"
                  maxlength="24"
                  placeholder="Your name"
                  data-i18n-placeholder="form.yourName"
                  autocomplete="nickname"
                  aria-label="Captain name"
                  data-i18n-aria-label="form.captainName"
                />
              </div>
              <div class="captain-account-actions">
                <button id="captain-sign-in" disabled aria-describedby="captain-auth-status">
                  <span data-i18n="account.signIn">Sign in</span>
                  <small id="captain-auth-status" data-i18n="account.comingSoon">Coming soon</small>
                </button>
                <button id="run-history-open" aria-haspopup="dialog" data-i18n="stats.history">
                  Run history
                </button>
              </div>
            </aside>
            <section class="departure-board" aria-labelledby="departure-title">
              <div class="departure-head">
                <div>
                  <h2 id="departure-title" data-i18n="harbor.departures">Departures</h2>
                  <p id="menu-status" role="status"></p>
                </div>
                <button
                  id="session-create-open"
                  class="primary"
                  aria-expanded="false"
                  aria-controls="session-create-form"
                  data-i18n="harbor.create"
                >
                  Create world
                </button>
              </div>
              <form id="session-create-form" class="session-form" hidden>
                <label for="session-name"
                  ><span data-i18n="form.sessionName">World name</span
                  ><input
                    id="session-name"
                    maxlength="40"
                    placeholder="Name your world"
                    data-i18n-placeholder="form.worldName"
                /></label>
                <button id="session-create" type="submit" class="primary" data-i18n="common.create">
                  Create
                </button>
                <button id="session-create-cancel" type="button" data-i18n="harbor.cancel">
                  Cancel
                </button>
              </form>
              <div id="session-list"></div>
              <p id="menu-error" role="alert"></p>
              <button id="coordinator-retry" data-i18n="connection.reconnect">Reconnect</button>
              <p id="world-status" role="status"></p>
              <div id="world-actions" hidden>
                <button id="world-retry" data-i18n="session.rejoin">Rejoin world</button>
                <button id="world-back" data-i18n="session.back">Back to sessions</button>
              </div>
              <dialog id="run-history" aria-labelledby="run-history-title">
                <div class="catalog-head">
                  <h2 id="run-history-title" data-i18n="stats.history">Run history</h2>
                  <button
                    id="run-history-close"
                    aria-label="Close"
                    data-i18n-aria-label="stats.close"
                  >
                    ×
                  </button>
                </div>
                <div id="run-history-list"></div>
              </dialog>
            </section>
          </div>
        </div>
      </section>
      <div
        id="game"
        role="img"
        aria-label="Island battlefield. Choose a tower below and click a meadow to build."
        data-i18n-aria-label="a11y.battlefield"
      ></div>
      <header class="hud">
        <div class="resource-hud">
          <img
            class="keep-icon"
            src="%BASE_URL%art/keep.png"
            alt="Keep"
            data-i18n-alt="a11y.keep"
          />
          <div id="resources"></div>
        </div>
        <div class="wave-hud">
          <div class="wave-number"><span id="wave-number"></span></div>
          <button id="capacity-open" class="biome-open" aria-haspopup="dialog" hidden></button>
          <button id="biome-open" class="biome-open" hidden></button>
          <button id="add-com" class="captain-picker-open" data-i18n="match.addCom" hidden>
            Add COM
          </button>
          <button id="start" class="primary">
            <span data-i18n="wave.start">Start wave ▷</span>
          </button>
          <button
            id="catalog-open"
            class="icon-button"
            aria-label="Open field guide"
            data-i18n-aria-label="a11y.openGuide"
            title="Field guide"
            data-i18n-title="a11y.guide"
          >
            ?
          </button>
          <button
            id="statistics-open"
            class="icon-button"
            data-i18n-title="stats.title"
            data-i18n-aria-label="stats.title"
            aria-label="Statistics"
            title="Statistics"
          >
            <svg
              class="statistics-button-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M4 3v17h17" />
              <path d="M8 16v-5M13 16V6M18 16V9" />
            </svg>
          </button>
          <details class="settings">
            <summary
              aria-label="Game settings"
              data-i18n-aria-label="a11y.settings"
              title="Game settings"
              data-i18n-title="a11y.settingsTitle"
            >
              ☰
            </summary>
            <div class="floating-panel">
              <strong><span data-i18n="app.name">Tiled Tower Defense</span></strong>
              <button id="audio-mute" type="button" aria-pressed="false">
                <span data-i18n="audio.mute">Mute sound</span>
              </button>
              <label class="audio-setting"
                ><span data-i18n="audio.effects">Effects</span>
                <input id="audio-effects" type="range" min="0" max="100" value="55"
              /></label>
              <label class="audio-setting"
                ><span data-i18n="audio.music">Music</span>
                <input id="audio-music" type="range" min="0" max="100" value="15"
              /></label>
              <p data-i18n="world.controls"></p>
              <p id="connection"></p>
              <button id="sessions-open"><span data-i18n="session.title">Sessions</span></button>
            </div>
          </details>
        </div>
      </header>
      <details
        id="wave-preview"
        open
        class="wave-panel"
        aria-label="Wave preview"
        data-i18n-aria-label="a11y.wavePreview"
      >
        <summary class="wave-caption">
          <span id="phase"></span>
          <h2 id="wave-title"></h2>
        </summary>
        <div id="wave-units"></div>
      </details>
      <aside id="selection-panel" class="floating-panel selection-panel" hidden>
        <button
          id="selection-close"
          class="close-button"
          aria-label="Close tower panel"
          data-i18n-aria-label="a11y.closeTower"
        >
          ×
        </button>
        <div id="selection"></div>
      </aside>
      <p id="notice" role="status" aria-live="polite"></p>
      <aside
        id="world-navigation"
        class="world-navigation"
        aria-label="World islands"
        data-i18n-aria-label="a11y.islands"
        hidden
      ></aside>
      <div id="world-controls" class="world-controls" hidden>
        <button id="world-home"><span data-i18n="world.home">My island</span></button
        ><button id="world-overview"><span data-i18n="world.overview">World view</span></button>
      </div>
      <section class="bottom-hud">
        <button id="dock-toggle" aria-expanded="true" aria-controls="action-dock draft">
          <span data-i18n="layout.hideActions">Hide actions</span>
        </button>
        <div class="play-hint">
          <p id="instruction"></p>
          <span id="army-count"></span>
        </div>
        <div id="draft" hidden>
          <h2><span data-i18n="island.expand">Expand your island</span></h2>
          <div id="draft-cards"></div>
        </div>
        <div id="action-dock" class="action-dock">
          <div class="dock-tabs">
            <button id="tab-build" class="active" aria-pressed="true">
              <span data-i18n="common.build">Build</span></button
            ><button id="tab-send" aria-pressed="false">
              <span data-i18n="common.recruit">Recruit</span></button
            ><span id="income"></span>
          </div>
          <div id="build-tray" class="card-tray"></div>
          <div id="send-tray" hidden>
            <div class="expedition-controls">
              <label
                ><span data-i18n="world.opponent">Opponent</span>
                <select id="opponent"></select></label
              ><label
                ><span data-i18n="world.troopsLabel">Troops</span>
                <input id="passengers" type="number" min="1" max="6" value="1"
              /></label>
            </div>
            <details class="stat-help">
              <summary data-i18n="ui.compareStats">Compare stats</summary>
              <p>
                <span aria-hidden="true">❤️</span> <span data-i18n="stat.health"></span> ·
                <span aria-hidden="true">👟</span> <span data-i18n="stat.speed"></span> ·
                <span aria-hidden="true">🏰</span> <span data-i18n="stat.leak"></span>
              </p>
              <div id="unit-comparison"></div>
            </details>
            <div id="send-cards" class="card-tray"></div>
          </div>
        </div>
      </section>
    </main>
    <dialog id="capacity-picker" aria-labelledby="capacity-title">
      <div class="catalog-head">
        <h2 id="capacity-title" data-i18n="match.capacity">Players</h2>
        <button
          id="capacity-close"
          data-i18n-aria-label="capacity.close"
          aria-label="Close player picker"
        >
          ×
        </button>
      </div>
      <div id="capacity-choices"></div>
      <p id="capacity-status" role="status"></p>
    </dialog>
    <dialog id="biome-picker" aria-labelledby="biome-title">
      <div class="catalog-head">
        <h2 id="biome-title" data-i18n="biome.choose">Biome</h2>
        <button id="biome-close" data-i18n-aria-label="biome.close" aria-label="Close biome picker">
          ×
        </button>
      </div>
      <div id="biome-choices"></div>
      <p id="biome-status" role="status"></p>
    </dialog>
    <dialog id="captain-picker" aria-labelledby="captain-picker-title">
      <div class="catalog-head">
        <h2 id="captain-picker-title" data-i18n="captain.choose">Choose your rival</h2>
        <button
          id="captain-picker-close"
          class="icon-button"
          data-i18n-aria-label="captain.close"
          aria-label="Close captain picker"
        >
          ×
        </button>
      </div>
      <p class="captain-picker-hint" data-i18n="captain.hint">
        Three captains. Three ways to conquer your island.
      </p>
      <div id="captain-choices" class="captain-choices"></div>
      <p id="captain-picker-status" role="status" aria-live="polite"></p>
    </dialog>
    <dialog id="match-result" aria-labelledby="result-title" aria-describedby="result-message">
      <div class="result-emblem"><img id="result-portrait" alt="" /></div>
      <h1 id="result-title"></h1>
      <p id="result-message"></p>
      <p id="result-stats"></p>
      <details class="result-report">
        <summary data-i18n="stats.report">Match report</summary>
        <div id="result-report"></div>
      </details>
      <div class="result-actions">
        <button id="result-sessions" class="primary" data-i18n="result.sessions">
          Back to sessions
        </button>
        <button id="result-spectate" data-i18n="result.spectate">Spectate</button>
      </div>
    </dialog>
    <dialog id="statistics" aria-labelledby="statistics-title">
      <div class="catalog-head">
        <h2 id="statistics-title" data-i18n="stats.title">Statistics</h2>
        <button
          id="statistics-close"
          data-i18n-aria-label="stats.close"
          aria-label="Close statistics"
        >
          ×
        </button>
      </div>
      <div id="statistics-content"></div>
    </dialog>
    <dialog id="catalog">
      <div class="catalog-head">
        <h2><span data-i18n="catalog.title">Field guide</span></h2>
        <button
          id="catalog-close"
          aria-label="Close field guide"
          data-i18n-aria-label="a11y.closeGuide"
        >
          ×
        </button>
      </div>
      <div id="catalog-content"></div>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
