<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#c6d3d6" />
    <title data-i18n="app.title">Tiled Tower Defense · Tile Tower Defense</title>
    <link rel="icon" href="%BASE_URL%art/keep.png" />
  </head>
  <body data-screen="menu">
    <main class="game-shell">
      <section
        id="session-menu"
        class="session-menu"
        aria-label="Multiplayer sessions"
        data-i18n-aria-label="a11y.sessions"
      >
        <div class="session-panel">
          <img class="menu-keep" src="%BASE_URL%art/keep.png" alt="" />
          <h1><span data-i18n="app.name">Tiled Tower Defense</span></h1>
          <p id="menu-status" role="status">
            <span data-i18n="session.connecting">Connecting…</span>
          </p>
          <div class="session-form">
            <label
              ><span data-i18n="form.captainName">Captain name</span
              ><input
                id="captain-name"
                maxlength="24"
                placeholder="Your name"
                data-i18n-placeholder="form.yourName"
                autocomplete="nickname" /></label
            ><button id="captain-save"><span data-i18n="common.save">Save</span></button>
          </div>
          <h2><span data-i18n="session.worlds">Worlds</span></h2>
          <div id="session-list"></div>
          <div class="session-form">
            <label
              ><span data-i18n="session.new">New world</span
              ><input
                id="session-name"
                maxlength="40"
                placeholder="Name your world"
                data-i18n-placeholder="form.worldName" /></label
            ><button id="session-create"><span data-i18n="common.create">Create</span></button>
          </div>
          <p id="menu-error" role="alert"></p>
          <button id="coordinator-retry">
            <span data-i18n="connection.reconnect">Reconnect</span>
          </button>
          <p id="world-status" role="status"></p>
          <div id="world-actions" hidden>
            <button id="world-retry"><span data-i18n="session.rejoin">Rejoin world</span></button
            ><button id="world-back"><span data-i18n="session.back">Back to sessions</span></button>
          </div>
        </div>
      </section>
      <div
        id="game"
        role="img"
        aria-label="Island battlefield. Choose a tower below and click a meadow to build."
        data-i18n-aria-label="a11y.battlefield"
      ></div>
      <header class="hud">
        <div class="resource-hud">
          <img
            class="keep-icon"
            src="%BASE_URL%art/keep.png"
            alt="Keep"
            data-i18n-alt="a11y.keep"
          />
          <div id="resources"></div>
        </div>
        <div class="wave-hud">
          <div class="wave-number"><span id="wave-number"></span></div>
          <button id="start" class="primary">
            <span data-i18n="wave.start">Start wave ▷</span>
          </button>
          <button
            id="catalog-open"
            class="icon-button"
            aria-label="Open field guide"
            data-i18n-aria-label="a11y.openGuide"
            title="Field guide"
            data-i18n-title="a11y.guide"
          >
            ?
          </button>
          <details class="settings">
            <summary
              aria-label="Game settings"
              data-i18n-aria-label="a11y.settings"
              title="Game settings"
              data-i18n-title="a11y.settingsTitle"
            >
              ☰
            </summary>
            <div class="floating-panel">
              <strong><span data-i18n="app.name">Tiled Tower Defense</span></strong>
              <button id="audio-mute" type="button" aria-pressed="false">
                <span data-i18n="audio.mute">Mute sound</span>
              </button>
              <label class="audio-setting"
                ><span data-i18n="audio.effects">Effects</span>
                <input id="audio-effects" type="range" min="0" max="100" value="55"
              /></label>
              <label class="audio-setting"
                ><span data-i18n="audio.music">Music</span>
                <input id="audio-music" type="range" min="0" max="100" value="15"
              /></label>
              <p id="connection"></p>
              <button id="sessions-open"><span data-i18n="session.title">Sessions</span></button>
            </div>
          </details>
        </div>
      </header>
      <section
        id="wave-preview"
        class="wave-panel"
        aria-label="Wave preview"
        data-i18n-aria-label="a11y.wavePreview"
      >
        <div class="wave-caption">
          <span id="phase"></span>
          <h2 id="wave-title"></h2>
        </div>
        <p id="wave-description"></p>
        <div id="wave-units"></div>
      </section>
      <aside id="selection-panel" class="floating-panel selection-panel" hidden>
        <button
          id="selection-close"
          class="close-button"
          aria-label="Close tower panel"
          data-i18n-aria-label="a11y.closeTower"
        >
          ×
        </button>
        <div id="selection"></div>
      </aside>
      <p id="notice" role="status" aria-live="polite"></p>
      <aside
        id="world-navigation"
        class="world-navigation"
        aria-label="World islands"
        data-i18n-aria-label="a11y.islands"
        hidden
      ></aside>
      <div id="world-controls" class="world-controls" hidden>
        <span
          ><span data-i18n="world.controls"
            >Drag to fly · Scroll to zoom · Arrow keys to pan</span
          ></span
        ><button id="world-home"><span data-i18n="world.home">My island</span></button
        ><button id="world-overview"><span data-i18n="world.overview">World view</span></button>
      </div>
      <section class="bottom-hud">
        <button id="dock-toggle" aria-expanded="true" aria-controls="action-dock draft">
          <span data-i18n="layout.hideActions">Hide actions</span>
        </button>
        <div class="play-hint">
          <p id="instruction"></p>
          <span id="army-count"></span>
        </div>
        <div id="draft" hidden>
          <h2><span data-i18n="island.expand">Expand your island</span></h2>
          <div id="draft-cards"></div>
        </div>
        <div id="action-dock" class="action-dock">
          <div class="dock-tabs">
            <button id="tab-build" class="active" aria-pressed="true">
              <span data-i18n="common.build">Build</span></button
            ><button id="tab-send" aria-pressed="false">
              <span data-i18n="common.recruit">Recruit</span></button
            ><span id="income"></span>
          </div>
          <div id="build-tray" class="card-tray"></div>
          <div id="send-tray" hidden>
            <div class="expedition-controls">
              <label
                ><span data-i18n="world.opponent">Opponent</span>
                <select id="opponent"></select></label
              ><label
                ><span data-i18n="world.troopsLabel">Troops</span>
                <input id="passengers" type="number" min="1" max="6" value="1"
              /></label>
            </div>
            <div id="send-cards" class="card-tray"></div>
            <p id="flight-status"></p>
          </div>
        </div>
      </section>
    </main>
    <dialog id="catalog">
      <div class="catalog-head">
        <h2><span data-i18n="catalog.title">Field guide</span></h2>
        <button
          id="catalog-close"
          aria-label="Close field guide"
          data-i18n-aria-label="a11y.closeGuide"
        >
          ×
        </button>
      </div>
      <div id="catalog-content"></div>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
