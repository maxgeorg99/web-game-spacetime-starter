<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Little Keep · Cooperative tower defense</title><style>
:root{font-family:system-ui,sans-serif;color:#f1e8d0;background:#132427;color-scheme:dark}*{box-sizing:border-box}body{margin:0}header{max-width:1440px;margin:auto;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:20px;margin:0}small{color:#a6b5ad}form{display:flex;align-items:end;gap:10px;flex-wrap:wrap}label{display:grid;gap:5px;font-size:12px;color:#a6b5ad}input,button{font:inherit;border-radius:6px;padding:10px 14px;border:1px solid #52685c}input{background:#21362f;color:#f1e8d0;width:140px}button{background:#dcc58b;color:#1b302c;cursor:pointer}button:disabled{opacity:.5}button:focus-visible,input:focus-visible{outline:3px solid #91dce5;outline-offset:2px}#share,#retry{background:transparent;color:#dcc58b}main{max-width:1440px;margin:auto}#status,#roster{margin:0;padding:8px 24px;min-height:32px;font-size:13px;color:#a6b5ad}#status{color:#dcc58b}canvas{display:block;width:100%;aspect-ratio:3/2;background:#192d30}footer{padding:18px 24px;font-size:12px;color:#8ea79b}@media(max-width:760px){header{align-items:start;flex-direction:column}input{width:120px}main{overflow:auto}canvas{min-width:960px}footer{line-height:1.6}}
</style></head><body><header><div><h1>Little Keep</h1><small>Cooperative tower defense · up to 8 players</small></div><form id="join"><label>Your name<input id="name" maxlength="24" required autocomplete="nickname"></label><label>Room code<input id="room" minlength="3" maxlength="12" pattern="[A-Za-z0-9]{3,12}" required></label><button id="connect">Join battlefield</button><button id="share" type="button">Copy invite</button><button id="retry" type="button" hidden>Reconnect</button></form></header><main><p id="status" role="status" aria-live="polite">Loading…</p><p id="roster"></p><canvas id="game" width="1440" height="960" aria-label="Isometric tower defense battlefield. Select a tower on the right and click a golden build pad."></canvas></main><footer>Three 19 × 19 battlefields · four towers · ten enemy species · twelve waves. Gold is shared. Empty rooms pause for 30 minutes. A new battlefield supplies a fresh treasury and keep.</footer><script type="module" src="./client.js"></script></body></html>
